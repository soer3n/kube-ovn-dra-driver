---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-ovn-dra-driver.fullname" . }}-role
  namespace: {{ include "kube-ovn-dra-driver.namespace" . }}
rules:
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["kubeovn.io"]
  resources: ["subnets"]
  verbs: ["get", "list", "watch"]
# A VLAN underlay subnet references a Vlan CR (spec.vlan), which in turn names a
# ProviderNetwork (spec.provider). The NIC profile resolves this chain at device
# enumeration time to determine the underlay bridge (br-<providerNetwork>).
- apiGroups: ["kubeovn.io"]
  resources: ["vlans", "provider-networks"]
  verbs: ["get", "list", "watch"]
# The NIC driver reserves a kube-ovn IP object per attached interface during
# NodePrepareResources (IPAM), and releases it on unprepare.
- apiGroups: ["kubeovn.io"]
  resources: ["ips"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
