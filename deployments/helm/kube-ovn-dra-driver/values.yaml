# Default values for kube-ovn-dra-driver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# The chart is published as kube-ovn-dra-driver-chart, next to the image
# kube-ovn-dra-driver; resources keep the name kube-ovn-dra-driver.
nameOverride: "kube-ovn-dra-driver"
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

allowDefaultNamespace: false

# deviceProfile describes the overall shape of the devices managed by the
# driver. Available profiles are:
#   - "nic": kube-ovn virtual NICs published per node from kube-ovn Subnets.
deviceProfile: "nic"

# driverName uniquely identifies the driver within the cluster. When empty, its
# value is derived from the deviceProfile (e.g. "nic.kubeovn.io").
driverName: ""

imagePullSecrets: []
image:
  repository: docker.io/soer3n/kube-ovn-dra-driver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

kubeletPlugin:
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
    # The kubeletplugin runs with hostNetwork and a fixed healthcheck port
    # (51515), so it cannot surge: a new pod started before the old one is
    # killed can never bind that port and crash-loops forever, hanging the
    # rollout. maxUnavailable must do the work instead.
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  # nicAttach configures the NIC attach datapath (NRI hook + OVS). The plugin
  # pod runs privileged with host network/PID and mounts the host OVS run dir,
  # so it can create veth pairs, enter pod netns and run ovs-vsctl. The image
  # must ship ovs-vsctl (the Dockerfile's default stage does).
  nicAttach:
    ovsRunDir: /var/run/openvswitch
    # Host directory holding pod network namespaces (CNI bind-mounts them here as
    # cni-<id>). Mounted with HostToContainer propagation so the NRI hook can
    # open the pod netns by path.
    netnsDir: /var/run/netns
  # Experimental: record the MAC of a KubeVirt VM's NIC on its VMI
  # (nic.kubeovn.io/mac.<interface>), for a KubeVirt Plugin CEL hook that adds
  # the NIC to the domain instead of the binding sidecar. Needs RBAC to patch VMIs.
  annotateVMIMAC: false
  containers:
    init:
      securityContext: {}
      resources: {}
    plugin:
      resources: {}
      # Port running a gRPC health service checked by a livenessProbe.
      # Set to a negative value to disable the service and the probe.
      healthcheckPort: 51515

# publisher switches the driver to the central publish mode (the default). One leader-elected
# publisher then publishes every kube-ovn Subnet as its own cluster-wide pool,
# named after the Subnet: available on all nodes for an overlay Subnet, and on the
# nodes where the ProviderNetwork is ready for a VLAN underlay Subnet, so the
# scheduler only places a pod where its NIC can work. With capacity the device
# also carries the free addresses of the Subnet, so the scheduler refuses a pod
# when the pool is exhausted. The kubelet plugins then publish nothing and only
# prepare claims.
#
# Without the publisher (node publish mode) every kubelet plugin publishes a pool
# for its node, with the Subnets it can serve and no capacity.
#
# Needs the DRAConsumableCapacity feature gate for capacity and for sharing a
# Subnet between pods: alpha in Kubernetes 1.34 and 1.35, beta and on by default
# from 1.36.
publisher:
  enabled: true
  # More replicas only speed up the takeover when the leader goes away.
  replicas: 2
  # Publish the free addresses of a Subnet as consumable capacity.
  capacity: true
  priorityClassName: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}

webhook:
  enabled: false
  servicePort: 443
  containerPort: 443
  priorityClassName: "system-cluster-critical"
  strategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  containers:
    webhook:
      securityContext:
        privileged: false
      resources: {}
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
