# Two plain pods on the default kube-ovn overlay subnet.
# Used by `make kind-test-kube-ovn` to confirm pod-to-pod connectivity works
# before layering on Multus and the NIC DRA driver.
apiVersion: v1
kind: Pod
metadata:
  name: kube-ovn-test-a
  labels:
    app: kube-ovn-test
spec:
  containers:
    - name: net
      image: nicolaka/netshoot@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: kube-ovn-test-b
  labels:
    app: kube-ovn-test
spec:
  containers:
    - name: net
      image: nicolaka/netshoot@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
      command: ["sleep", "3600"]
