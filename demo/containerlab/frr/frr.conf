! FRR configuration for the nic-dra-demo VLAN gateway (frr-gw).
!
! frr-gw runs in the host network namespace. The exec commands of the
! containerlab topology give its eth1 trunk one 802.1q sub-interface per demo
! VLAN with the gateway address of the VLAN subnet (.253; .1 for the benchmark
! VLANs). Pods on a VLAN subnet reach that gateway over L2, and the host has a
! connected route to every VLAN subnet. No routing protocol runs: zebra only
! manages the interfaces.
!
frr version 10.2
frr defaults traditional
hostname frr-gw
log syslog informational
no ipv6 forwarding
!
line vty
!
