! FRR configuration for nic-dra-demo VLAN gateway (frr-gw).
!
! Role: eBGP route reflector between kube-ovn-speaker (ASN 65000) and the
!       host routing table. Runs in host network-mode so BGP-learned routes
!       are installed directly into the host kernel via zebra/netlink.
!
! BGP design:
!   - frr-gw ASN: 65001
!   - kube-ovn-speaker ASN: 65000  (kube-ovn default)
!   - Peers: one per kind node, on the VLAN 100 sub-interface addresses
!     that kube-ovn assigns to the node (172.23.0.x / 172.24.0.x range).
!
! kube-ovn-speaker advertises:
!   172.23.0.0/24  (vlan100-subnet)
!   172.24.0.0/24  (vlan200-subnet)
!   plus any allocated pod IPs within those subnets.
!
! frr-gw accepts those prefixes and zebra installs them into the host
! kernel via the loopback / host netlink interface.
!
! Peer IPs are the node gateway addresses that kube-ovn assigns on eth1.100
! and eth1.200. kube-ovn-speaker listens on the node's primary IP (eth0),
! but since frr-gw is in host network-mode it can reach the nodes via the
! kind Docker bridge (172.20.0.0/16).
!
! Adjust CONTROL_PLANE_IP and WORKER_IP to match your cluster nodes:
!   kubectl get nodes -o wide
!
! Or run:  make kind-frr-update-peers
!
frr version 10.2
frr defaults traditional
hostname frr-gw
log syslog informational
no ipv6 forwarding
!
router bgp 65001
 bgp router-id 172.23.0.253
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 ! ---- Peer with kube-ovn-speaker on control-plane node ----
 ! Replace with:  kubectl get node nic-dra-demo-control-plane -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}'
 neighbor CONTROL_PLANE_IP remote-as 65000
 neighbor CONTROL_PLANE_IP description kube-ovn-speaker-control-plane
 neighbor CONTROL_PLANE_IP update-source eth1.100
 !
 ! ---- Peer with kube-ovn-speaker on worker node ----
 ! Replace with:  kubectl get node nic-dra-demo-worker -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}'
 neighbor WORKER_IP remote-as 65000
 neighbor WORKER_IP description kube-ovn-speaker-worker
 neighbor WORKER_IP update-source eth1.100
 !
 address-family ipv4 unicast
  ! Accept VLAN subnet prefixes from kube-ovn-speaker.
  neighbor CONTROL_PLANE_IP activate
  neighbor CONTROL_PLANE_IP soft-reconfiguration inbound
  neighbor CONTROL_PLANE_IP prefix-list VLAN-SUBNETS in
  neighbor CONTROL_PLANE_IP route-map ACCEPT-ALL out
  !
  neighbor WORKER_IP activate
  neighbor WORKER_IP soft-reconfiguration inbound
  neighbor WORKER_IP prefix-list VLAN-SUBNETS in
  neighbor WORKER_IP route-map ACCEPT-ALL out
  !
  ! Redistribute connected (eth1.100, eth1.200 gateway addresses) so peers
  ! know the gateway is reachable.
  redistribute connected
 exit-address-family
!
! Only accept the demo VLAN subnets (172.23-172.30.0.0/24) — block everything else.
ip prefix-list VLAN-SUBNETS seq 10 permit 172.23.0.0/24 le 32
ip prefix-list VLAN-SUBNETS seq 20 permit 172.24.0.0/24 le 32
ip prefix-list VLAN-SUBNETS seq 30 permit 172.25.0.0/24 le 32
ip prefix-list VLAN-SUBNETS seq 40 permit 172.26.0.0/24 le 32
ip prefix-list VLAN-SUBNETS seq 50 permit 172.27.0.0/24 le 32
ip prefix-list VLAN-SUBNETS seq 60 permit 172.28.0.0/24 le 32
ip prefix-list VLAN-SUBNETS seq 70 permit 172.29.0.0/24 le 32
ip prefix-list VLAN-SUBNETS seq 80 permit 172.30.0.0/24 le 32
ip prefix-list VLAN-SUBNETS seq 100 deny any
!
route-map ACCEPT-ALL permit 10
!
line vty
!
