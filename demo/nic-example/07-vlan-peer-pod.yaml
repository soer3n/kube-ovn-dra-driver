# Per-VLAN connectivity test fixture (8 VLANs).
# GENERATED by examples/generate.py.
#   vlan<N>-peer  (control-plane)  net1 on vlan<N>-subnet
#   vlan-worker   (worker)         net1..netK across all VLAN subnets
# Cross-node traffic crosses eth1 through the vlan-switch with 802.1q tags.
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: vlan100-peer-nic
  namespace: default
spec:
  devices:
    requests:
      - name: net0
        exactly:
          deviceClassName: kube-ovn-nic
          selectors:
            - cel:
                expression: "device.attributes['nic.kubeovn.io'].subnetName == 'vlan100-subnet'"
          count: 1
    config:
      - requests: ["net0"]
        opaque:
          driver: nic.kubeovn.io
          parameters:
            apiVersion: nic.resource.kube-ovn.io/v1alpha1
            kind: NicConfig
            interfaceName: net1
---
apiVersion: v1
kind: Pod
metadata:
  name: vlan100-peer
  namespace: default
  labels:
    app: vlan-peer-test
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resourceClaims:
    - name: nics
      resourceClaimName: vlan100-peer-nic
  containers:
    - name: peer
      image: nicolaka/netshoot@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
      command: ["sleep", "infinity"]
      resources:
        claims:
          - name: nics
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
---
