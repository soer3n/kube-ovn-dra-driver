# PodNetwork objects for the multi-network-api second mode.
# One per VLAN subnet so the DRA driver can resolve subnet names by logical network name.
#
# Pre-requisite:
#   kubectl apply -f demo/nic-example/crds/podnetwork-crd.yaml
---
apiVersion: multinetwork.networking.k8s.io/v1alpha1
kind: PodNetwork
metadata:
  name: vlan100-network
spec:
  provider: nic.kubeovn.io
  parameters:
    subnetName: vlan100-subnet
---
apiVersion: multinetwork.networking.k8s.io/v1alpha1
kind: PodNetwork
metadata:
  name: vlan200-network
spec:
  provider: nic.kubeovn.io
  parameters:
    subnetName: vlan200-subnet
