# PodNetwork CRD — local stand-in for the proposed multi-network-api type.
#
# STATUS: EXPERIMENTAL
# This CRD is a forward-compatible approximation of the PodNetwork type being
# designed in kubernetes-sigs/multi-network-api (PR#2 / PR#4). It will be
# replaced by the upstream-shipped CRD once the API is merged.
#
# Key design choices kept in sync with the upstream draft:
#   - API group:  multinetwork.networking.k8s.io
#   - Version:    v1alpha1
#   - Cluster-scoped (no namespace)
#   - spec.provider: controller name string (mirrors GatewayClass pattern)
#   - spec.parameters: opaque driver-specific config (runtime.RawExtension equivalent)
#   - status.conditions[Ready]: set by the provider's DRA driver
#
# To install:
#   kubectl apply -f demo/nic-example/crds/podnetwork-crd.yaml
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podnetworks.multinetwork.networking.k8s.io
  annotations:
    # Required for CRDs in protected *.k8s.io groups. This is an experimental
    # local stand-in for an unmerged API, so it is explicitly unapproved.
    api-approved.kubernetes.io: "unapproved, experimental multi-network-api stand-in"
    # Track upstream PR so reviewers know this is a local draft.
    multinetwork.networking.k8s.io/upstream-pr: "https://github.com/kubernetes-sigs/multi-network-api/pull/2"
spec:
  group: multinetwork.networking.k8s.io
  scope: Cluster
  names:
    plural: podnetworks
    singular: podnetwork
    kind: PodNetwork
    # kubectl get podnetwork  (same category proposed in PR#4)
    categories:
      - podnetwork
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            PodNetwork represents a named logical network that pods can attach to
            via DRA ResourceClaims. Each PodNetwork is owned by exactly one
            provider (DRA driver). Multiple NetworkKind objects cannot reference
            the same Group/Kind (1:1 binding per upstream design).
          properties:
            spec:
              type: object
              properties:
                provider:
                  type: string
                  description: |
                    Identifies the DRA driver responsible for this network.
                    Must be a fully-qualified driver name (e.g. nic.kubeovn.io).
                    Mirrors the controllerName pattern from GatewayClass.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "provider is immutable once set"
                parameters:
                  type: object
                  description: |
                    Driver-specific network configuration. The schema is defined
                    by the provider. For nic.kubeovn.io the only required field
                    is subnetName.
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    subnetName:
                      type: string
                      description: |
                        (nic.kubeovn.io) Name of the kube-ovn Subnet CRD to use
                        for IP address allocation. Required when provider is
                        nic.kubeovn.io.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                        description: "Condition type (e.g. Ready, SubnetAvailable)."
                      status:
                        type: string
                        enum: [True, False, Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Subnet
          type: string
          jsonPath: .spec.parameters.subnetName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
