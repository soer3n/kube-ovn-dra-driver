# kube-ovn ProviderNetwork, VLANs and subnets for the DRA NIC driver demo.
#
# 8 VLAN underlay subnets (vlan100-subnet .. vlan800-subnet) and
# 8 OVN overlay subnets (ovn-subnet, ovn-subnet-2 .. ovn-subnet-8).
# The scaling examples under examples/ attach an equal split of these to a pod.
#
# GENERATED by examples/generate.py — edit there, not here.
# VLAN underlay requires the matching containerlab wiring (make clab-deploy).
---
apiVersion: kubeovn.io/v1
kind: ProviderNetwork
metadata:
  name: external
spec:
  defaultInterface: eth1
---
apiVersion: kubeovn.io/v1
kind: Vlan
metadata:
  name: vlan100
spec:
  id: 100
  provider: external
---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: vlan100-subnet
spec:
  protocol: IPv4
  cidrBlock: 172.23.0.0/24
  # FRR gateway on eth1.100 (.253) is the L3 next-hop; .1 has no device.
  gateway: 172.23.0.253
  excludeIps:
    - 172.23.0.253
    - 172.23.0.254
  vlan: vlan100
  provider: external.vlan100-subnet.ovn
---
