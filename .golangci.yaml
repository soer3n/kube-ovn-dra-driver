# please keep this alphabetized
# Kube-OVN's lint rules (kube-ovn/.golangci.yml) plus the driver's own.
version: "2"
run:
  tests: true
linters:
  enable:
    - asciicheck
    - contextcheck
    - errorlint
    - forcetypeassert
    - gocritic
    - godot
    - gosec
    - loggercheck
    - misspell
    - perfsprint
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - usestdlibvars
    - whitespace
  settings:
    errorlint:
      asserts: false
    perfsprint:
      strconcat: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocritic
        text: appendAssign
      - linters:
          - revive
        text: avoid meaningless package names
      # The e2e specs dot-import Ginkgo and Gomega, unlike Kube-OVN's e2e.
      - linters:
          - revive
        text: should not use dot imports
        path: test/e2e/
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - gosec
        path: test/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/soer3n/kube-ovn-dra-driver
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
